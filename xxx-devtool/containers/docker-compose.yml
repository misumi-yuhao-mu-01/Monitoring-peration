version: "3"
services:
  db:
    image: postgres:11
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: misumi
    ports:
      - "5432:5432"
    volumes:
      - misumi_db:/var/lib/postgresql/data
      - ./postgres/init.d:/docker-entrypoint-initdb.d

  localstack:
    image: localstack/localstack
    network_mode: bridge
    ports:
      - "4566:4566" # kinesis, dynamodb, sqs, s3
      - "8001:8001"
    environment:
      - SERVICES=kinesis,sqs,dynamodb,s3
      - DEBUG=${DEBUG- }
      - DATA_DIR=/tmp/localstack/data
      - PORT_WEB_UI=8001
      - KINESIS_ERROR_PROBABILITY=0.0 # 0.0-1.0。どの確率でProvisionedThroughputExceededExceptionを投げるか
    volumes:
      - "localstack-vol:/tmp/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
  redis:
    image: "redis:7.0.10"
    ports:
      - "6379:6379"
    volumes:
      - "./data/redis:/data"

volumes:
  localstack-vol:
  misumi_db:
